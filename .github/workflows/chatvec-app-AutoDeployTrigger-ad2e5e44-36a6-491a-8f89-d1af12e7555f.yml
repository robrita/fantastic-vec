name: Trigger auto deployment for chatvec-app

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ rob-chatvec ]
    paths:
    - '**'
    - '.github/workflows/chatvec-app-AutoDeployTrigger-ad2e5e44-36a6-491a-8f89-d1af12e7555f.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.CHATVECAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CHATVECAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CHATVECAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: 
          registryUsername: ${{ secrets.CHATVECAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CHATVECAPP_REGISTRY_PASSWORD }}
          containerAppName: chatvec-app
          resourceGroup: r0bai
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


